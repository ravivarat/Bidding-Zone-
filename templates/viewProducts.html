{% extends "header/bidderHeader.html" %} {% block body %}
<div class="contact_section layout_padding"
    style="background-color: whitesmoke;">
    <div class="container">
        <div class="row">
            <div class="col-sm-12 col-lg-12">
                       <h1 class="about_text" style="color: blue;">Biiding on Current Product </h1>
            </div>
        </div>
        <!-- <div class="service_section_2"> -->
        <hr />
        <div class="row">

          {% if products %}


            {% for product  in products %}
                <div class="col-md-4">
                    <main>
                    <img src="../static/products/{{product[4]}}" alt="Product Name">
                    <hr/>
                    <h2 align="center">{{product[1]}}</h2>
                    <p style="text-align: justify;">{{product[2]}}</p>
                    <p>Price: {{product[5]}}</p>
                    <p>Bidding Date: {{product[6]}} &nbsp; To &nbsp; {{product[7]}}</p>
                    <button class="btn btn-primary btn-block"><a href="{{ url_for('bidder_add_cart', id=product[0] )}}" style="color: white;"> Add To Cart</a></button>
                    <button class="btn btn-primary btn-block"><a href="{{ url_for('seller_delete_product', id=product[0] )}}" style="color: white;"> Bidding</a></button>

                </main>
                <hr/>
            </div>
             {% endfor %}
           {% endif %}
            
        </div>
        <br />
    </div>
</div>
</div>
</div>


{% endblock %}
